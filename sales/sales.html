<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 관리 - Ryanlen ERP</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="sales">
    <div data-shell-content>
        <div class="page-head">
            <div class="page-head-main">
                <span class="page-head-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg></span>
                <div>
                    <h1 class="page-title">프로젝트 관리</h1>
                    <p class="page-desc">프로젝트 수주 등록, 진행 현황, 납품과 매출을 연계해 관리합니다.</p>
                </div>
            </div>
        </div>

        <section class="card pj-summary" aria-label="전체 프로젝트 현황">
            <div class="pj-summary-head">
                <h2 class="pj-summary-title">전체 프로젝트 현황</h2>
                <span class="muted" id="sum-total"></span>
            </div>
            <div class="pj-kpis" id="sum-kpis"></div>
            <div class="pj-summary-body">
                <div class="pj-pipeline">
                    <div class="pj-sub-title">상태별 분포 <span class="muted">· 클릭하면 목록이 필터링됩니다</span></div>
                    <div class="pj-stack" id="sum-stack" role="group" aria-label="상태별 건수 분포"></div>
                    <div class="pj-legend" id="sum-grid"></div>
                </div>
            </div>
        </section>

        <section class="card data-card" aria-label="프로젝트 목록">
            <div class="pj-list-head">
            <div class="tabs" id="status-tabs" role="tablist" aria-label="진행상태"></div>
            <div class="page-actions pj-list-actions">
                <button type="button" class="btn-primary" id="btn-new">+ 프로젝트 등록</button>
                <div class="menu-wrap">
                    <button type="button" class="btn-secondary btn-icon" id="btn-more" aria-label="더보기" aria-haspopup="true" aria-expanded="false">⋯</button>
                    <div class="menu-pop" id="more-pop" hidden>
                        <button type="button" id="act-csv">현재 목록 CSV 내보내기</button>
                    </div>
                </div>
            </div>
            </div>
            <div class="data-filters">
                <label class="search-field">
                    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" class="input" id="f-search" placeholder="프로젝트번호, 거래처, 프로젝트명 검색" aria-label="검색">
                </label>
                <select class="filter-select" id="f-period" aria-label="기간">
                    <option value="">기간 전체</option>
                    <option value="month">이번 달</option>
                    <option value="3m">최근 3개월</option>
                    <option value="year">올해</option>
                </select>
                <select class="filter-select" id="f-partner" aria-label="거래처"></select>
                <select class="filter-select" id="f-manager" aria-label="담당자"></select>
                <button type="button" class="btn-ghost" id="f-reset">초기화</button>
            </div>
            <div class="bulk-bar" id="bulk-bar" hidden>
                <strong id="bulk-count"></strong>
                <select class="filter-select" id="bulk-status" aria-label="변경할 상태"></select>
                <button type="button" class="btn-primary" id="bulk-apply">상태 변경</button>
                <button type="button" class="btn-danger" id="bulk-delete" data-manager-only>삭제</button>
            </div>
            <div class="data-table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col" class="col-check"><input type="checkbox" id="check-all" aria-label="현재 페이지 전체 선택"></th>
                            <th scope="col">프로젝트번호</th>
                            <th scope="col" class="sortable" data-sort="orderDate">수주일</th>
                            <th scope="col">거래처</th>
                            <th scope="col">프로젝트명</th>
                            <th scope="col" class="sortable" data-sort="dueDate">마감일</th>
                            <th scope="col">진행률</th>
                            <th scope="col" class="num sortable" data-sort="amount">금액</th>
                            <th scope="col">진행상태</th>
                            <th scope="col">담당자</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="pager" id="pager"></div>
        </section>
    </div>

    <!-- 프로젝트 등록·수정 -->
    <div class="modal-overlay" id="modal-form" hidden>
        <form class="modal form-modal" role="dialog" aria-modal="true" aria-labelledby="form-title" id="project-form" autocomplete="off" novalidate>
            <div class="modal-header">
                <h3 id="form-title">프로젝트 등록</h3>
                <button type="button" class="modal-close" data-close aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <label class="form-field span-2"><span>프로젝트명 *</span><input type="text" class="modal-input" id="p-name" maxlength="60" placeholder="예: 2026 유지보수 계약" required></label>
                    <label class="form-field"><span>거래처 *</span><input type="text" class="modal-input" id="p-partner" maxlength="40" list="partner-list" placeholder="예: (주)테크솔루션" required><datalist id="partner-list"></datalist></label>
                    <label class="form-field"><span>담당자</span><select class="modal-select" id="p-manager"></select></label>
                    <div class="form-field span-2" id="p-biz"></div>
                    <label class="form-field"><span>수주일 *</span><input type="date" class="modal-input" id="p-order" required></label>
                    <div class="form-field">
                        <span>마감일</span>
                        <input type="date" class="modal-input" id="p-due">
                        <span class="due-tools">
                            <button type="button" class="btn-secondary due-chip" id="p-due-plus5">수주+5영업일</button>
                            <button type="button" class="btn-secondary due-chip" id="p-due-eom">월말 영업일</button>
                        </span>
                        <p class="due-hint" id="p-due-hint" hidden></p>
                    </div>
                    <label class="form-field"><span>계약 금액 (원) *</span><input type="text" class="modal-input num-input" id="p-amount" inputmode="numeric" placeholder="0" required></label>
                    <label class="form-field"><span>진행상태</span><select class="modal-select" id="p-status"></select></label>
                    <label class="form-field"><span>진행률 (%)</span><input type="number" class="modal-input" id="p-progress" min="0" max="100" step="5" value="0"></label>
                    <label class="form-field span-2"><span>메모</span><textarea class="modal-input" id="p-memo" maxlength="300" placeholder="범위, 특이사항 등 (선택)"></textarea></label>
                </div>
                <p class="form-error" id="form-error" hidden></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-close>취소</button>
                <button type="submit" class="btn-primary" id="form-submit">등록</button>
            </div>
        </form>
    </div>

    <!-- 프로젝트 상세 -->
    <div class="modal-overlay" id="modal-detail" hidden>
        <div class="modal form-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="modal-header">
                <h3 id="detail-title">프로젝트 상세</h3>
                <button type="button" class="modal-close" data-close aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <dl class="detail-grid" id="detail-grid"></dl>
                <span class="modal-label">처리 이력</span>
                <ul class="detail-history" id="detail-history"></ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-ghost spacer" id="d-delete" data-manager-only>삭제</button>
                <button type="button" class="btn-secondary" id="d-edit">수정</button>
                <button type="button" class="btn-primary" id="d-next"></button>
            </div>
        </div>
    </div>

    <!-- 마감 주의 목록 -->
    <div class="modal-overlay" id="modal-attn" hidden>
        <div class="modal form-modal" role="dialog" aria-modal="true" aria-labelledby="attn-title">
            <div class="modal-header">
                <h3 id="attn-title">마감 주의 <span class="muted" id="attn-count"></span></h3>
                <button type="button" class="modal-close" data-close aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <ul class="pj-attn-list" id="sum-attn"></ul>
            </div>
        </div>
    </div>

    <div class="app-toast" id="app-toast" role="status" aria-live="polite" hidden>
        <span id="app-toast-text"></span>
        <button type="button" class="app-toast-action" id="app-toast-action" hidden></button>
    </div>

    <script src="../sync.js"></script>
    <script src="../members.js"></script>
    <script src="../integrations.js"></script>
    <script src="../shell.js"></script>
    <script src="../ui-kit.js"></script>
    <script>
    (function () {
        if (!GW.guardPage("sales", "../index.html")) return;
        var U = GWUI, esc = U.escapeHtml;
        var KEY = GW.PREFIX + "projects";
        var me = GW.getCurrent();
        var isManager = GW.isManager(me);

        var STATUS = {
            pending: { label: "진행전", cls: "st-yellow" },
            progress: { label: "진행중", cls: "st-green" },
            delivery: { label: "검수", cls: "st-blue" },
            billing: { label: "입금대기", cls: "st-violet" },
            done: { label: "완료", cls: "st-dark" },
            cancel: { label: "취소", cls: "st-red" }
        };
        var STATUS_ORDER = ["pending", "progress", "delivery", "billing", "done", "cancel"];
        // 상세 화면의 '다음 단계' 버튼
        var NEXT = { pending: "progress", progress: "delivery", delivery: "billing", billing: "done" };

        // ---------- 데이터 (첫 방문 때만 예시 프로젝트 생성) ----------
        function seed() {
            var t = U.today();
            var managers = GW.activeMembers().map(function (m) { return m.name; });
            var pick = function (i) { return managers[i % managers.length] || me.name; };
            var rows = [
                ["(주)테크솔루션", "2026 유지보수 계약 이행", 36000000, "progress", 65, -2, 70],
                ["(주)테크솔루션", "Q2 신규 모듈 도입", 85000000, "pending", 0, -3, 120],
                ["글로벌트레이드", "수출입 관리 시스템 개선", 21300000, "progress", 40, -5, 45],
                ["디지털인프라", "클라우드 이전 컨설팅", 15500000, "delivery", 95, -8, 5],
                ["디지털인프라", "보안 점검 및 리포트", 9600000, "done", 100, -12, -2],
                ["스마트시티코리아", "IoT 대시보드 구축", 48000000, "progress", 25, -15, 90],
                ["(주)대한상사", "ERP 연동 API 개발", 12800000, "delivery", 90, -18, 3],
                ["(주)이레산업", "생산관리 화면 리뉴얼", 8450000, "billing", 100, -22, -6],
                ["(주)한빛전자", "사내 포털 고도화", 5800000, "cancel", 10, -25, 30],
                ["(주)세종산업", "데이터 마이그레이션", 7200000, "progress", 55, -28, 14],
                ["(주)코리아테크", "모바일 앱 MVP", 11400000, "pending", 0, -30, 60],
                ["(주)유니텍", "정기 점검 3분기", 6800000, "done", 100, -40, -10],
                ["글로벌트레이드", "물류 대시보드 추가 개발", 4500000, "done", 100, -55, -20],
                ["(주)대한상사", "업무 자동화 PoC", 3000000, "cancel", 0, -70, -30]
            ];
            return rows.map(function (r, i) {
                var order = U.addDays(t, r[5]);
                return {
                    id: "p" + (i + 1), no: "", partner: r[0], name: r[1], amount: r[2], status: r[3], progress: r[4],
                    orderDate: order, dueDate: U.addDays(t, r[6]), manager: pick(i + 2), memo: "", createdAt: Date.now() - i * 1000,
                    history: [{ at: order, by: pick(i + 2), action: "등록" }]
                };
            });
        }
        var list = U.readJSON(KEY, null);
        if (!Array.isArray(list)) {
            list = seed();
            list.slice().sort(function (a, b) { return a.orderDate < b.orderDate ? -1 : 1; }).forEach(function (p) { p.no = nextNumber(p.orderDate); });
            U.writeJSON(KEY, list);
        }
        function save() { U.writeJSON(KEY, list); }
        // 프로젝트번호: PJ-연도-순번(연도별 4자리)
        function nextNumber(date) {
            var year = date.slice(0, 4);
            var max = list.reduce(function (m, p) {
                var match = /^PJ-(\d{4})-(\d{4})$/.exec(p.no || "");
                return match && match[1] === year ? Math.max(m, Number(match[2])) : m;
            }, 0);
            return "PJ-" + year + "-" + String(max + 1).padStart(4, "0");
        }
        function byId(id) { return list.filter(function (p) { return p.id === id; })[0]; }

        // ---------- 필터 ----------
        var state = { tab: "all", page: 1, size: 10, sort: "orderDate", dir: -1, selected: {} };
        var fSearch = document.getElementById("f-search"), fPeriod = document.getElementById("f-period");
        var fPartner = document.getElementById("f-partner"), fManager = document.getElementById("f-manager");
        function periodStart() {
            var d = new Date();
            if (fPeriod.value === "month") d.setDate(1);
            else if (fPeriod.value === "3m") d.setMonth(d.getMonth() - 3);
            else if (fPeriod.value === "year") { d.setMonth(0); d.setDate(1); }
            else return "";
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }
        function renderFilterOptions() {
            var fill = function (sel, label, values) {
                var prev = sel.value;
                sel.innerHTML = '<option value="">' + label + "</option>" + values.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + "</option>"; }).join("");
                sel.value = values.indexOf(prev) !== -1 ? prev : "";
            };
            var uniq = function (key) {
                var o = {};
                list.forEach(function (p) { if (p[key]) o[p[key]] = true; });
                return Object.keys(o).sort(function (a, b) { return a.localeCompare(b, "ko"); });
            };
            fill(fPartner, "거래처", uniq("partner"));
            fill(fManager, "담당자", uniq("manager"));
        }
        function baseFiltered() {
            var q = fSearch.value.trim().toLowerCase();
            var from = periodStart();
            return list.filter(function (p) {
                if (from && p.orderDate < from) return false;
                if (fPartner.value && p.partner !== fPartner.value) return false;
                if (fManager.value && p.manager !== fManager.value) return false;
                if (q && (p.no + " " + p.partner + " " + p.name).toLowerCase().indexOf(q) === -1) return false;
                return true;
            });
        }
        function currentRows() {
            var rows = baseFiltered().filter(function (p) { return state.tab === "all" || p.status === state.tab; });
            rows.sort(function (a, b) {
                var x;
                if (state.sort === "amount") x = a.amount - b.amount;
                else x = String(a[state.sort] || "").localeCompare(String(b[state.sort] || "")) || a.createdAt - b.createdAt;
                return x * state.dir;
            });
            return rows;
        }

        // ---------- 렌더링 ----------
        function renderTabs() {
            var base = baseFiltered();
            var tabs = [{ id: "all", label: "전체" }].concat(STATUS_ORDER.map(function (k) { return { id: k, label: STATUS[k].label }; }));
            document.getElementById("status-tabs").innerHTML = tabs.map(function (t) {
                var count = t.id === "all" ? base.length : base.filter(function (p) { return p.status === t.id; }).length;
                var on = state.tab === t.id;
                return '<button type="button" class="tab' + (on ? " is-active" : "") + '" role="tab" aria-selected="' + on + '" data-tab="' + t.id + '">' +
                    esc(t.label) + ' <span class="count-pill">' + count + "</span></button>";
            }).join("");
        }
        function dueCell(p) {
            if (!p.dueDate) return '<span class="muted">—</span>';
            var open = p.status === "progress" || p.status === "delivery" || p.status === "pending";
            var late = open && GW.isLate(p.dueDate);
            var name = GW.holidayName(p.dueDate);
            var title = late ? "마감일이 지났습니다" : (name || (GW.isWeekend(p.dueDate) ? "주말" : ""));
            return '<span class="' + (late ? "st st-red" : "muted") + '"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + esc(p.dueDate) + (name ? " · " + esc(name) : "") + "</span>";
        }
        function partnerCell(p) {
            return esc(p.partner) + GW.bizBadge(p.bizStatus, p.bizStatusName);
        }
        function progressBar(p) {
            return '<span class="progress"><span class="progress-track"><span class="progress-fill" style="width:' + p.progress + '%"></span></span><span class="progress-value">' + p.progress + "%</span></span>";
        }
        // 현황 막대·범례: 오른쪽 끝 '취소'부터 진행 순서대로 왼쪽으로 배치
        var SUM_ORDER = ["done", "billing", "delivery", "progress", "pending", "cancel"];
        var SEG = { pending: "#d4a106", progress: "var(--success)", delivery: "var(--info)", billing: "#7c3aed", done: "#1f2937", cancel: "var(--danger)" };
        function renderSummary() {
            var total = list.length;
            var sum = function (arr) { return arr.reduce(function (n, p) { return n + (p.amount || 0); }, 0); };
            var by = function (k) { return list.filter(function (p) { return p.status === k; }); };
            var open = list.filter(function (p) { return p.status === "pending" || p.status === "progress" || p.status === "delivery"; });
            var running = by("progress").concat(by("delivery"));
            var avg = running.length ? Math.round(running.reduce(function (n, p) { return n + (p.progress || 0); }, 0) / running.length) : 0;
            var late = open.filter(function (p) { return p.dueDate && GW.isLate(p.dueDate); });
            var limit = U.addDays(U.today(), 7);
            var soon = open.filter(function (p) { return p.dueDate && !GW.isLate(p.dueDate) && p.dueDate <= limit; });
            var attn = late.concat(soon);
            var won = function (n) { return n >= 100000000 ? (Math.round(n / 1000000) / 100) + "억" : n >= 10000 ? U.won(Math.round(n / 10000)) + "만" : U.won(n); };
            document.getElementById("sum-total").textContent = "기준일 " + U.today();

            var kpi = function (label, value, sub, tone, tab) {
                return '<' + (tab ? 'button type="button" ' + (tab === "attn" ? 'data-attn="1"' : 'data-tab="' + tab + '"') : 'div') + ' class="pj-kpi' + (tone ? " is-" + tone : "") + '">' +
                    '<span class="pj-kpi-label">' + label + '</span><span class="pj-kpi-value">' + value + '</span><span class="pj-kpi-sub">' + sub + '</span></' + (tab ? "button" : "div") + '>';
            };
            document.getElementById("sum-kpis").innerHTML =
                kpi("전체 프로젝트", total + "<small>건</small>", "취소 " + by("cancel").length + "건 포함", "", "all") +
                kpi("진행 중", open.length + "<small>건</small>", "평균 진행률 " + avg + "%", "info") +
                kpi("총 계약 금액", won(sum(list.filter(function (p) { return p.status !== "cancel"; }))) + "<small>원</small>", "완료 " + won(sum(by("done"))) + " · 입금대기 " + won(sum(by("billing"))) + "원", "") +
                kpi("마감 주의", attn.length + "<small>건</small>", "초과 " + late.length + " · 7일 내 " + soon.length, attn.length ? "danger" : "good", "attn");

            document.getElementById("sum-stack").innerHTML = total ? SUM_ORDER.map(function (k) {
                var n = by(k).length;
                return n ? '<button type="button" class="pj-seg" data-tab="' + k + '" style="flex:' + n + ';background:' + SEG[k] + '" title="' + esc(STATUS[k].label) + " " + n + '건"><span>' + n + "</span></button>" : "";
            }).join("") : '<span class="pj-seg-empty">프로젝트가 없습니다</span>';
            document.getElementById("sum-grid").innerHTML = SUM_ORDER.map(function (k) {
                var rows = by(k);
                return '<button type="button" class="pj-leg" data-tab="' + k + '"><span class="pj-dot" style="background:' + SEG[k] + '"></span>' +
                    '<span class="pj-leg-name">' + esc(STATUS[k].label) + '</span><span class="pj-leg-n">' + rows.length + '건</span>' +
                    '<span class="pj-leg-amt">' + won(sum(rows)) + '원</span></button>';
            }).join("");

            attn.sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; });
            document.getElementById("attn-count").textContent = attn.length ? "· " + attn.length + "건" : "";
            document.getElementById("sum-attn").innerHTML = attn.length ? attn.map(function (p) {
                var isLate = GW.isLate(p.dueDate);
                var days = Math.round((new Date(p.dueDate) - new Date(U.today())) / 86400000);
                return '<li><button type="button" class="pj-attn-item" data-open="' + p.id + '">' +
                    '<span class="st ' + (isLate ? "st-red" : "st-orange") + '">' + (isLate ? "D+" + (-days) : days === 0 ? "D-day" : "D-" + days) + '</span>' +
                    '<span class="pj-attn-name">' + esc(p.name) + '<small>' + esc(p.partner) + " · " + esc(p.manager || "담당자 없음") + '</small></span>' +
                    '<span class="pj-attn-pct">' + p.progress + '%</span></button></li>';
            }).join("") : '<li class="pj-attn-empty">마감이 지났거나 7일 내 임박한 프로젝트가 없습니다.</li>';
        }
        var attnModal = document.getElementById("modal-attn");
        U.wireModal(attnModal);
        document.getElementById("sum-attn").addEventListener("click", function (e) {
            var b = e.target.closest("[data-open]");
            if (!b) return;
            U.closeModal(attnModal);
            openDetail(b.getAttribute("data-open"));
        });
        document.getElementById("sum-kpis").addEventListener("click", function (e) {
            if (e.target.closest("[data-attn]")) { U.openModal(attnModal); return; }
            var b = e.target.closest("[data-tab]");
            if (!b) return;
            state.tab = b.getAttribute("data-tab"); state.page = 1; render();
        });
        document.getElementById("sum-stack").addEventListener("click", function (e) {
            var b = e.target.closest("[data-tab]");
            if (!b) return;
            state.tab = b.getAttribute("data-tab"); state.page = 1; render();
            document.getElementById("status-tabs").scrollIntoView({ behavior: "smooth", block: "center" });
        });
        document.getElementById("sum-grid").addEventListener("click", function (e) {
            var b = e.target.closest("[data-tab]");
            if (!b) return;
            state.tab = b.getAttribute("data-tab"); state.page = 1; render();
            document.getElementById("status-tabs").scrollIntoView({ behavior: "smooth", block: "center" });
        });
        function render() {
            renderSummary();
            renderTabs();
            var rows = currentRows();
            var pages = Math.max(1, Math.ceil(rows.length / state.size));
            if (state.page > pages) state.page = pages;
            var pageRows = rows.slice((state.page - 1) * state.size, state.page * state.size);
            var tbody = document.getElementById("rows");
            if (!pageRows.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="data-empty">' + (list.length ? "조건에 맞는 프로젝트가 없습니다." : "등록된 프로젝트가 없습니다. 오른쪽 위 '+ 프로젝트 등록'으로 시작하세요.") + "</td></tr>";
            } else {
                tbody.innerHTML = pageRows.map(function (p) {
                    var sel = !!state.selected[p.id];
                    return '<tr data-id="' + p.id + '"' + (sel ? ' class="is-selected"' : "") + ">" +
                        '<td class="col-check"><input type="checkbox" class="row-check" data-id="' + p.id + '"' + (sel ? " checked" : "") + ' aria-label="' + esc(p.no) + ' 선택"></td>' +
                        '<td><button type="button" class="doc-link">' + esc(p.no) + "</button></td>" +
                        '<td class="muted">' + esc(p.orderDate) + "</td>" +
                        '<td class="ellipsis">' + partnerCell(p) + "</td>" +
                        '<td class="ellipsis" title="' + esc(p.name) + '">' + esc(p.name) + "</td>" +
                        "<td>" + dueCell(p) + "</td>" +
                        "<td>" + progressBar(p) + "</td>" +
                        '<td class="num">' + U.won(p.amount) + "</td>" +
                        '<td><span class="st ' + STATUS[p.status].cls + '">' + STATUS[p.status].label + "</span></td>" +
                        '<td class="muted">' + esc(p.manager || "—") + "</td></tr>";
                }).join("");
            }
            document.querySelectorAll(".data-table th.sortable").forEach(function (th) {
                var on = th.dataset.sort === state.sort;
                th.setAttribute("aria-sort", on ? (state.dir > 0 ? "ascending" : "descending") : "none");
                th.innerHTML = th.textContent.replace(/[▲▼]/g, "").trim() + (on ? '<span class="sort-mark">' + (state.dir > 0 ? "▲" : "▼") + "</span>" : "");
            });
            document.getElementById("check-all").checked = pageRows.length > 0 && pageRows.every(function (p) { return state.selected[p.id]; });
            U.renderPager(document.getElementById("pager"), {
                total: rows.length, page: state.page, size: state.size,
                onPage: function (n) { state.page = n; render(); },
                onSize: function (n) { state.size = n; state.page = 1; render(); }
            });
            renderBulk();
        }
        function selectedIds() { return Object.keys(state.selected).filter(function (id) { return state.selected[id] && byId(id); }); }
        function renderBulk() {
            var ids = selectedIds();
            document.getElementById("bulk-bar").hidden = !ids.length;
            document.getElementById("bulk-count").textContent = ids.length + "건 선택됨";
            document.querySelectorAll("[data-manager-only]").forEach(function (b) { b.hidden = !isManager; });
        }
        document.getElementById("bulk-status").innerHTML = STATUS_ORDER.map(function (k) { return '<option value="' + k + '">' + STATUS[k].label + "(으)로</option>"; }).join("");

        // ---------- 이벤트 ----------
        document.getElementById("status-tabs").addEventListener("click", function (e) {
            var b = e.target.closest("[data-tab]");
            if (!b) return;
            state.tab = b.dataset.tab;
            state.page = 1;
            render();
        });
        fSearch.addEventListener("input", function () { state.page = 1; render(); });
        [fPeriod, fPartner, fManager].forEach(function (el) { el.addEventListener("change", function () { state.page = 1; render(); }); });
        document.getElementById("f-reset").addEventListener("click", function () {
            fSearch.value = ""; fPeriod.value = ""; fPartner.value = ""; fManager.value = "";
            state.tab = "all"; state.page = 1;
            render();
        });
        document.querySelectorAll(".data-table th.sortable").forEach(function (th) {
            th.tabIndex = 0;
            var toggle = function () {
                if (state.sort === th.dataset.sort) state.dir = -state.dir;
                else { state.sort = th.dataset.sort; state.dir = -1; }
                render();
            };
            th.addEventListener("click", toggle);
            th.addEventListener("keydown", function (e) { if (e.key === "Enter") toggle(); });
        });
        document.getElementById("rows").addEventListener("click", function (e) {
            var cb = e.target.closest(".row-check");
            if (cb) {
                state.selected[cb.dataset.id] = cb.checked;
                cb.closest("tr").classList.toggle("is-selected", cb.checked);
                renderBulk();
                return;
            }
            if (e.target.closest(".col-check")) return;
            var tr = e.target.closest("tr[data-id]");
            if (tr) openDetail(tr.dataset.id);
        });
        document.getElementById("check-all").addEventListener("change", function (e) {
            currentRows().slice((state.page - 1) * state.size, state.page * state.size).forEach(function (p) { state.selected[p.id] = e.target.checked; });
            render();
        });

        function log(p, action) {
            p.history = p.history || [];
            p.history.push({ at: U.today(), by: me.name, action: action });
        }
        function setStatus(ids, status) {
            var targets = ids.map(byId).filter(function (p) { return p && p.status !== status; });
            if (!targets.length) return;
            var before = targets.map(function (p) { return JSON.parse(JSON.stringify(p)); });
            targets.forEach(function (p) {
                p.status = status;
                if (status === "done" || status === "billing") p.progress = 100;
                log(p, "상태 변경 → " + STATUS[status].label);
            });
            save();
            state.selected = {};
            render();
            U.toast(targets.length + "건을 '" + STATUS[status].label + "'(으)로 변경했습니다.", function () {
                before.forEach(function (old) {
                    var idx = list.findIndex(function (p) { return p.id === old.id; });
                    if (idx !== -1) list[idx] = old;
                });
                save();
                render();
            });
        }
        function removeProjects(ids) {
            if (!isManager) return;
            var targets = ids.map(byId).filter(Boolean);
            var snapshot = list.slice();
            list = list.filter(function (p) { return targets.indexOf(p) === -1; });
            save();
            state.selected = {};
            renderFilterOptions();
            render();
            U.toast("프로젝트 " + targets.length + "건을 삭제했습니다.", function () {
                list = snapshot;
                save();
                renderFilterOptions();
                render();
            });
        }
        document.getElementById("bulk-apply").addEventListener("click", function () { setStatus(selectedIds(), document.getElementById("bulk-status").value); });
        document.getElementById("bulk-delete").addEventListener("click", function () { removeProjects(selectedIds()); });

        // ---------- 등록·수정 ----------
        var formModal = document.getElementById("modal-form");
        var form = document.getElementById("project-form");
        var F = {
            name: document.getElementById("p-name"), partner: document.getElementById("p-partner"), manager: document.getElementById("p-manager"),
            order: document.getElementById("p-order"), due: document.getElementById("p-due"), amount: document.getElementById("p-amount"),
            status: document.getElementById("p-status"), progress: document.getElementById("p-progress"), memo: document.getElementById("p-memo")
        };
        var formError = document.getElementById("form-error");
        var dueHint = document.getElementById("p-due-hint");
        var editingId = null;
        var biz = GW.mountBiz({
            mount: document.getElementById("p-biz"),
            nameInput: F.partner,
            peers: function () {
                return list.filter(function (x) { return x.id !== editingId && x.bizNo; }).map(function (x) { return { name: x.partner, bizNo: x.bizNo }; });
            }
        });
        function refreshDueHint() {
            var due = F.due.value;
            if (!due || !GW.isOff(due)) { dueHint.hidden = true; dueHint.textContent = ""; return; }
            var prev = GW.previousBusinessDay(due);
            var name = GW.holidayName(due) || "주말";
            dueHint.hidden = false;
            dueHint.innerHTML = esc(name) + "입니다. 이전 영업일은 " + esc(prev) + "입니다. " +
                '<button type="button" class="btn-secondary due-chip" id="p-due-prev">이전 영업일로</button>';
            document.getElementById("p-due-prev").addEventListener("click", function () {
                F.due.value = prev;
                refreshDueHint();
            });
        }
        F.due.addEventListener("change", refreshDueHint);
        document.getElementById("p-due-plus5").addEventListener("click", function () {
            if (!F.order.value) { formError.textContent = "수주일을 먼저 입력하세요."; formError.hidden = false; return; }
            F.due.value = GW.addBusinessDays(F.order.value, 5);
            formError.hidden = true;
            refreshDueHint();
        });
        document.getElementById("p-due-eom").addEventListener("click", function () {
            var base = F.order.value || U.today();
            F.due.value = GW.monthEndBusinessDay(base);
            formError.hidden = true;
            refreshDueHint();
        });
        U.wireModal(formModal);
        U.bindAmountInput(F.amount);
        F.status.innerHTML = STATUS_ORDER.map(function (k) { return '<option value="' + k + '">' + STATUS[k].label + "</option>"; }).join("");
        function openForm(p) {
            editingId = p ? p.id : null;
            document.getElementById("form-title").textContent = p ? "프로젝트 수정 · " + p.no : "프로젝트 등록";
            document.getElementById("form-submit").textContent = p ? "수정 저장" : "등록";
            var names = GW.activeMembers().map(function (m) { return m.name; });
            if (p && p.manager && names.indexOf(p.manager) === -1) names.push(p.manager);
            F.manager.innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + "</option>"; }).join("");
            F.name.value = p ? p.name : "";
            F.partner.value = p ? p.partner : "";
            F.manager.value = p ? p.manager : me.name;
            F.order.value = p ? p.orderDate : U.today();
            F.due.value = p ? p.dueDate || "" : "";
            F.amount.value = p ? p.amount.toLocaleString("ko-KR") : "";
            F.status.value = p ? p.status : "pending";
            F.progress.value = p ? p.progress : 0;
            F.memo.value = p ? p.memo || "" : "";
            if (biz) biz.fill(p);
            refreshDueHint();
            formError.hidden = true;
            var partners = {};
            list.forEach(function (x) { partners[x.partner] = true; });
            document.getElementById("partner-list").innerHTML = Object.keys(partners).sort().map(function (v) { return '<option value="' + esc(v) + '">'; }).join("");
            U.openModal(formModal);
        }
        document.getElementById("btn-new").addEventListener("click", function () { openForm(null); });
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var name = F.name.value.trim(), partner = F.partner.value.trim(), amount = U.parseAmount(F.amount.value);
            var problem = !name ? "프로젝트명을 입력하세요." : !partner ? "거래처를 입력하세요." : !F.order.value ? "수주일을 입력하세요." : !amount ? "계약 금액을 입력하세요." :
                (F.due.value && F.due.value < F.order.value) ? "마감일은 수주일 이후여야 합니다." : "";
            if (problem) {
                formError.textContent = problem;
                formError.hidden = false;
                return;
            }
            var submitBtn = document.getElementById("form-submit");
            submitBtn.disabled = true;
            biz.confirm(function (rec) {
                submitBtn.disabled = false;
                if (rec === false) return;
                var progress = Math.min(100, Math.max(0, parseInt(F.progress.value, 10) || 0));
                var data = { name: name, partner: F.partner.value.trim(), manager: F.manager.value, orderDate: F.order.value, dueDate: F.due.value, amount: amount, status: F.status.value, progress: F.status.value === "done" || F.status.value === "billing" ? 100 : progress, memo: F.memo.value.trim() };
                GW.applyBiz(data, rec);
                if (editingId) {
                    var p = byId(editingId);
                    Object.assign(p, data);
                    log(p, "수정");
                    U.toast(p.no + " 프로젝트를 수정했습니다.");
                } else {
                    var created = Object.assign({ id: "p" + Date.now().toString(36), no: nextNumber(data.orderDate), createdAt: Date.now(), history: [] }, data);
                    log(created, "등록");
                    list.push(created);
                    state.tab = "all";
                    U.toast(created.no + " 프로젝트를 등록했습니다.");
                }
                save();
                renderFilterOptions();
                U.closeModal(formModal);
                render();
            });
        });

        // ---------- 상세 ----------
        var detailModal = document.getElementById("modal-detail");
        var detailId = null;
        U.wireModal(detailModal);
        function openDetail(id) {
            var p = byId(id);
            if (!p) return;
            detailId = id;
            document.getElementById("detail-title").textContent = "프로젝트 상세 · " + p.no;
            var fields = [
                ["프로젝트명", esc(p.name)], ["거래처", partnerCell(p)], ["담당자", esc(p.manager || "—")],
                ["사업자번호", p.bizNo ? esc(p.bizNo.replace(/(\d{3})(\d{2})(\d{5})/, "$1-$2-$3")) + (p.bizTaxType ? " · " + esc(p.bizTaxType) : "") : "—"],
                ["수주일", esc(p.orderDate)], ["마감일", dueCell(p)], ["계약 금액", U.won(p.amount) + "원"],
                ["진행상태", '<span class="st ' + STATUS[p.status].cls + '">' + STATUS[p.status].label + "</span>"],
                ["진행률", progressBar(p)],
                ["메모", esc(p.memo || "—")]
            ];
            document.getElementById("detail-grid").innerHTML = fields.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + f[1] + "</dd>"; }).join("");
            document.getElementById("detail-history").innerHTML = (p.history || []).slice().reverse().map(function (h) {
                return "<li>" + esc(h.at) + " · " + esc(h.by) + " · " + esc(h.action) + "</li>";
            }).join("") || "<li>이력 없음</li>";
            var next = NEXT[p.status];
            var nextBtn = document.getElementById("d-next");
            nextBtn.hidden = !next;
            if (next) nextBtn.textContent = STATUS[next].label + "(으)로 변경";
            document.getElementById("d-delete").hidden = !isManager;
            U.openModal(detailModal);
        }
        document.getElementById("d-next").addEventListener("click", function () {
            var p = byId(detailId);
            U.closeModal(detailModal);
            if (p && NEXT[p.status]) setStatus([detailId], NEXT[p.status]);
        });
        document.getElementById("d-edit").addEventListener("click", function () { U.closeModal(detailModal); openForm(byId(detailId)); });
        document.getElementById("d-delete").addEventListener("click", function () { U.closeModal(detailModal); removeProjects([detailId]); });

        // ---------- 더보기 ----------
        U.wireMenu(document.getElementById("btn-more"), document.getElementById("more-pop"));
        document.getElementById("act-csv").addEventListener("click", function () {
            var rows = currentRows();
            if (!rows.length) { U.toast("내보낼 프로젝트가 없습니다."); return; }
            U.downloadCsv("프로젝트목록_" + U.today() + ".csv",
                ["프로젝트번호", "수주일", "거래처", "사업자번호", "사업자상태", "프로젝트명", "마감일", "진행률", "금액", "진행상태", "담당자", "메모"],
                rows.map(function (p) { return [p.no, p.orderDate, p.partner, p.bizNo || "", p.bizStatusName || "", p.name, p.dueDate, p.progress + "%", p.amount, STATUS[p.status].label, p.manager, p.memo]; }));
        });

        renderFilterOptions();
        document.addEventListener("gw-holidays", render);
        var q = new URLSearchParams(location.search).get("q");
        if (q) {
            fSearch.value = q;
            history.replaceState(null, "", location.pathname);
        }
        render();
    })();
    </script>
</body>
</html>
